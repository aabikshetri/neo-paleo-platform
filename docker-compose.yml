services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neo
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: neo-development
    ports:
      - "5433:5432"
    volumes:
      - neo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo -d neo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://neo:neo-development@postgres:5432/neo
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo_postgres_data:
