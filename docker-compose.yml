services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: neo
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: neo-development
    ports:
      - "5433:5432"
    volumes:
      - neo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo -d neo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: amoebascope-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://neo:neo-development@postgres:5432/neo
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      WEB_CONCURRENCY: 2
      DATABASE_POOL_SIZE: 4
      DATABASE_CACHE_SIZE: 128
      DATABASE_CACHE_TTL_SECONDS: 120
      REQUEST_TIMEOUT_SECONDS: 120
      UVICORN_LIMIT_CONCURRENCY: 200
      FORWARDED_ALLOW_IPS: "*"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-analogue:
    image: amoebascope-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker"]
    environment:
      DATABASE_URL: postgresql://neo:neo-development@postgres:5432/neo
      REDIS_URL: redis://redis:6379/0
      DATABASE_POOL_SIZE: 2
      SCIENTIFIC_JOB_TYPES: modern_analogue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-nmds:
    image: amoebascope-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker"]
    environment:
      DATABASE_URL: postgresql://neo:neo-development@postgres:5432/neo
      REDIS_URL: redis://redis:6379/0
      DATABASE_POOL_SIZE: 2
      SCIENTIFIC_JOB_TYPES: nmds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo_postgres_data:
